name: Build & Release sip-client

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: sip-client.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: sip-client
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --target ${{ matrix.target }} --verbose

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Binary (.zip & .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactName = "sip-client-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $artifactName
          Copy-Item "target/${{ matrix.target }}/release/sip-client.exe" -Destination $artifactName/
          Copy-Item "README.md", "LICENSE" -Destination $artifactName/
          Compress-Archive -Path "$artifactName/*" -DestinationPath "$artifactName.zip"
          Copy-Item "target/${{ matrix.target }}/release/sip-client.exe" -Destination "sip-client-windows-x86_64.exe"
          echo "ARTIFACT_PATH=$artifactName.zip" >> $env:GITHUB_ENV

      - name: Package Linux Binary (.tar.gz)
        if: runner.os == 'Linux'
        run: |
          ARTIFACT_NAME="sip-client-${{ matrix.target }}"
          mkdir -p "$ARTIFACT_NAME"
          cp "target/${{ matrix.target }}/release/sip-client" "$ARTIFACT_NAME/"
          cp README.md LICENSE "$ARTIFACT_NAME/"
          tar -czvf "${ARTIFACT_NAME}.tar.gz" -C "$ARTIFACT_NAME" .
          echo "ARTIFACT_PATH=${ARTIFACT_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sip-client-${{ matrix.target }}
          path: ${{ env.ARTIFACT_PATH }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_PATH }}
            sip-client-windows-*.exe
          generate_release_notes: true

  winget-publish:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Wait for release assets propagation
        run: sleep 30

      - name: Submit package to WinGet
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: MahirGul.sip-client
          token: ${{ secrets.WINGET_TOKEN }}
