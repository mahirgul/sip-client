[package]
name = "sip-client"
version = "0.4.0"
edition = "2024"
authors = ["Mahir Gül <mahirgul@gmail.com>"]
description = "Lightweight, cross-platform terminal & Win32 SIP client in Rust with automated audio playback and RTP streaming"
license = "MIT"
readme = "README.md"
homepage = "https://mahirgul.github.io/sip-client/"
repository = "https://github.com/mahirgul/sip-client"
keywords = ["sip", "voip", "rtp", "telephony", "audio"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
rand = "0.8"
chrono = "0.4"
ctrlc = "3.4"
log = "0.4"
env_logger = "0.11"
hound = "3.5"
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Foundation"] }
