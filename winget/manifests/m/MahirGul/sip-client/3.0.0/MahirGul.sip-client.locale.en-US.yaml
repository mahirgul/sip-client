ShortDescription: Minimalist cross-platform SIP softphone client with automated audio playback
Description: |-
  sip-client is a lightweight, zero-bloat cross-platform SIP client written in Rust.
  It works seamlessly on Windows (native Win32 console/terminal) and Linux.
  Features include RFC 3261 SIP signaling over UDP, digest MD5 authentication,
  and automated WAV audio streaming over standard RTP (PCMU/G.711u) upon call answer.
